{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет / Вход</title>
    
    <link href="https://jsdelivr.net" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'attendance/css/style.css' %}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="{% static 'attendance/images/logo.png' %}" alt="Лого" width="30" class="d-inline-block align-text-top me-2">
                Журнал СТИ
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-sm p-4 text-center">
                    <h3 class="mb-3 text-primary">Панель Студента</h3>
                    <p class="text-muted">Добро пожаловать в систему посещаемости!</p>
                    <button class="btn btn-outline-danger w-100" type="button" data-bs-toggle="collapse" data-bs-target="#infoBox">
                        Показать важную информацию
                    </button>
                    
                    <div class="collapse mt-3" id="infoBox">
                        <div class="card card-body bg-light text-start small">
                            Не забывайте отмечаться на лекциях вовремя!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
