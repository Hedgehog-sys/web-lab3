{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему СТИ</title>
    <link rel="stylesheet" href="{% static 'attendance/css/bootstrap.min.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <h4 class="text-center mb-4 text-primary">Авторизация СТИ</h4>
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-danger p-2 small text-center">
                    Неверный логин или пароль
                </div>
            {% endif %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label">Логин</label>
                <input type="text" name="username" id="id_username" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label for="id_password" class="form-label">Пароль</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
    </div>

</body>
</html>
